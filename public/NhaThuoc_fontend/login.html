<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - MediGreen Pharmacy</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="login-wrapper">
        <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Về Trang Chủ</a>

        <div class="login-container">
            
            <div class="login-left">
                <div class="login-header">
                    <h2>Chào mừng trở lại!</h2>
                    <p>Vui lòng đăng nhập để tiếp tục mua sắm</p>
                </div>

                <form>
                    <div class="form-group">
                        <label>Email hoặc Số điện thoại</label>
                        <div class="input-icon-wrap">
                            <i class="fa-regular fa-envelope"></i>
                            <input type="text" placeholder="Nhập email/SĐT của bạn">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Mật khẩu</label>
                        <div class="input-icon-wrap">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" placeholder="Nhập mật khẩu" id="password-field">
                            <i class="fa-regular fa-eye-slash toggle-pass"></i>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember-check">
                            <input type="checkbox"> <span>Ghi nhớ đăng nhập</span>
                        </label>
                        <a href="#" class="forgot-link">Quên mật khẩu?</a>
                    </div>

                    <button type="button" class="btn-submit">Đăng Nhập</button>
                </form>

                <div class="divider">Hoặc đăng nhập với</div>

                <div class="social-login">
                    <button class="social-btn google">
                        <i class="fa-brands fa-google"></i> Google
                    </button>
                    <button class="social-btn facebook">
                        <i class="fa-brands fa-facebook-f"></i> Facebook
                    </button>
                </div>

                <p class="register-text">
                    Bạn chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
                </p>
            </div>

            <div class="login-right">
                <div class="logo-large">
                    <i class="fa-solid fa-leaf"></i>
                    <div>Medi<span>Green</span></div>
                </div>
                <p class="brand-slogan">Hệ thống nhà thuốc chuẩn GPP<br>Chăm sóc sức khỏe gia đình bạn.</p>
                <img src="/img/ảnh logo thuoc.png" alt="Banner" class="banner-img">
            </div>

        </div>
    </div>

    <script>
        const toggleBtn = document.querySelector('.toggle-pass');
        const passInput = document.getElementById('password-field');
        toggleBtn.addEventListener('click', () => {
            if (passInput.type === "password") {
                passInput.type = "text";
                toggleBtn.classList.replace('fa-eye-slash', 'fa-eye');
            } else {
                passInput.type = "password";
                toggleBtn.classList.replace('fa-eye', 'fa-eye-slash');
            }
        });
    </script>
</body>
</html>
