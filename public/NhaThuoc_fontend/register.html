<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - MediGreen Pharmacy</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/register.css">
</head>
<body>

    <div class="register-wrapper">
        <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Về Trang Chủ</a>

        <div class="register-container">
            
            <div class="register-left">
                <div class="register-header">
                    <h2>Tạo tài khoản mới</h2>
                    <p>Đăng ký để nhận ngay ưu đãi 50K cho đơn đầu tiên!</p>
                </div>

                <form>
                    <div class="form-group">
                        <label>Họ và tên</label>
                        <div class="input-icon-wrap">
                            <i class="fa-regular fa-user"></i>
                            <input type="text" placeholder="Ví dụ: Nguyễn Văn A">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Email hoặc Số điện thoại</label>
                        <div class="input-icon-wrap">
                            <i class="fa-regular fa-envelope"></i>
                            <input type="text" placeholder="Nhập email/SĐT của bạn">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Mật khẩu</label>
                        <div class="input-icon-wrap">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" placeholder="Tạo mật khẩu" class="pass-input">
                            <i class="fa-regular fa-eye-slash toggle-pass"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Nhập lại mật khẩu</label>
                        <div class="input-icon-wrap">
                            <i class="fa-solid fa-shield-halved"></i>
                            <input type="password" placeholder="Nhập lại mật khẩu" class="pass-input">
                        </div>
                    </div>

                    <div class="terms-group">
                        <label class="terms-check">
                            <input type="checkbox" required>
                            <span>Tôi đồng ý với <a href="#">Điều khoản sử dụng</a> và <a href="#">Chính sách bảo mật</a></span>
                        </label>
                    </div>

                    <button type="button" class="btn-submit">Đăng Ký Ngay</button>
                </form>

                <div class="divider">Hoặc đăng ký với</div>

                <div class="social-login">
                    <button class="social-btn google">
                        <i class="fa-brands fa-google"></i> Google
                    </button>
                    <button class="social-btn facebook">
                        <i class="fa-brands fa-facebook-f"></i> Facebook
                    </button>
                </div>

                <p class="login-text">
                    Bạn đã có tài khoản? <a href="login.html">Đăng nhập</a>
                </p>
            </div>

            <div class="register-right">
                <div class="logo-large">
                    <i class="fa-solid fa-leaf"></i>
                    <div>Medi<span>Green</span></div>
                </div>
                <p class="brand-slogan">Sống khỏe mỗi ngày cùng<br>Hệ thống nhà thuốc chuẩn GPP</p>
                
                <img src="/img/ảnh logo thuoc.png" alt="Banner" class="banner-img">
            </div>

        </div>
    </div>

    <script>
        const toggleBtn = document.querySelector('.toggle-pass');
        const passInputs = document.querySelectorAll('.pass-input');

        toggleBtn.addEventListener('click', () => {
            passInputs.forEach(input => {
                if (input.type === "password") {
                    input.type = "text";
                    toggleBtn.classList.replace('fa-eye-slash', 'fa-eye');
                } else {
                    input.type = "password";
                    toggleBtn.classList.replace('fa-eye', 'fa-eye-slash');
                }
            });
        });
    </script>
</body>
</html>
